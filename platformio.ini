; Growatt GBLI 6532 -> Solis S6-EH1P8K-L-PLUS CAN translator
;
;   Sniff the live Growatt link first (listen-only, one CAN channel):
;     pio run -e sniffer -t upload && pio device monitor
;
;   Then the translator itself:
;     pio run -e translator -t upload && pio device monitor
;
; Envs, one per BOARD in src/config.h:
;   translator / sniffer               -> Autosport Labs ESP32-CAN-X2 (default BOARD)
;   translator-devkit / sniffer-devkit -> plain ESP32 DevKit + SN65HVD230 (+MCP2515)
;   translator-t2can                   -> LilyGo T-2Can (non-FD)
; Each -devkit/-t2can env passes -D BOARD=... so no file editing is needed to
; switch - just pick the matching -e for your hardware. T-2Can's TWAI pins
; (GPIO 7/6) happen to match ESP32-CAN-X2's, but the plain `sniffer` env
; still needs its own -t2can variant for the ARDUINO_USB_CDC_ON_BOOT flag
; below - without it, Serial is silent on a T-2Can even though CAN itself
; works fine.

[common]
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600
lib_deps       = coryjfowler/mcp_can @ ^1.5.1
build_flags    = -Wall

; ---- Autosport Labs ESP32-CAN-X2 (ESP32-S3, TWAI + MCP2515) -----------------
; Used by the `translator`/`sniffer` envs (BOARD_ESP32_CAN_X2, the default).
[esp32s3]
platform = espressif32
board    = esp32-s3-devkitc-1

; ---- Plain ESP32 DevKit V1 --------------------------------------------------
; Used by the `translator-devkit`/`sniffer-devkit` envs (BOARD_ESP32_DEVKIT).
[esp32classic]
platform = espressif32
board    = esp32dev

; =============================================================================

[env:translator]
extends          = esp32s3, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags}
build_src_filter = +<*> -<sniffer.cpp>

[env:sniffer]
extends          = esp32s3, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags}
build_src_filter = +<sniffer.cpp>

; ---- Same firmware, budget board (plain ESP32 DevKit V1) --------------------
[env:translator-devkit]
extends          = esp32classic, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags} -D BOARD=BOARD_ESP32_DEVKIT
build_src_filter = +<*> -<sniffer.cpp>

[env:sniffer-devkit]
extends          = esp32classic, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags} -D BOARD=BOARD_ESP32_DEVKIT
build_src_filter = +<sniffer.cpp>

; ---- Same firmware, LilyGo T-2Can (non-FD) -----------------------------------
; -D ARDUINO_USB_CDC_ON_BOOT=true: confirmed necessary on real hardware
; (2026-08-31) - without it, Serial silently goes nowhere even though the
; chip and USB connection are completely healthy (esptool talks to it fine
; via the ROM USB-Serial/JTAG peripheral throughout). Matches LilyGo's own
; T-2Can README FAQ, which documents this exact flag for the same reason.
[env:translator-t2can]
extends          = esp32s3, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags} -D BOARD=BOARD_LILYGO_T2CAN -D ARDUINO_USB_CDC_ON_BOOT=true
build_src_filter = +<*> -<sniffer.cpp>

[env:sniffer-t2can]
extends          = esp32s3, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags} -D BOARD=BOARD_LILYGO_T2CAN -D ARDUINO_USB_CDC_ON_BOOT=true
build_src_filter = +<sniffer.cpp>
