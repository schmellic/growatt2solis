; Growatt GBLI 6532 -> Solis S6-EH1P8K-L-PLUS CAN translator
;
;   Sniff the live Growatt link first (listen-only, one CAN channel):
;     pio run -e sniffer -t upload && pio device monitor
;
;   Then the translator itself:
;     pio run -e translator -t upload && pio device monitor
;
; Set BOARD in src/config.h to match your hardware, and pick the matching
; [env:...] board line below.

[common]
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600
lib_deps       = coryjfowler/mcp_can @ ^1.5.1
build_flags    = -Wall

; ---- Autosport Labs ESP32-CAN-X2 (ESP32-S3, TWAI + MCP2515) -----------------
; This is the default. Set BOARD = BOARD_ESP32_CAN_X2 in config.h.
[esp32s3]
platform = espressif32
board    = esp32-s3-devkitc-1

; ---- Plain ESP32 DevKit V1 --------------------------------------------------
; Set BOARD = BOARD_ESP32_DEVKIT in config.h and swap `extends` below.
[esp32classic]
platform = espressif32
board    = esp32dev

; =============================================================================

[env:translator]
extends          = esp32s3, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags}
build_src_filter = +<*> -<sniffer.cpp>

[env:sniffer]
extends          = esp32s3, common
framework        = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_speed     = ${common.upload_speed}
lib_deps         = ${common.lib_deps}
build_flags      = ${common.build_flags}
build_src_filter = +<sniffer.cpp>
